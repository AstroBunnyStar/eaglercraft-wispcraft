name: fetch-fixtures

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-fixtures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fixtures
        run: |
          set -euo pipefail
          mkdir -p test/fixtures
          curl -fsSL -o test/fixtures/legacy64x32.png https://litter.catbox.moe/3gz1n4.png
          curl -fsSL -o test/fixtures/legacy-expected.json https://litter.catbox.moe/lpfjpr.json
          echo "d1f627ef2821f7c6d17def69824f39bc153898b20e027256c50ff8309248bbe7  test/fixtures/legacy64x32.png" | sha256sum -c -
          echo "57223d974fbae7696b1fc37d09bdaa4f95a7eb3b9c0a5f2079cfdc9d774946d2  test/fixtures/legacy-expected.json" | sha256sum -c -

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fixtures
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "Add the legacy skin fixtures" && git push; fi
