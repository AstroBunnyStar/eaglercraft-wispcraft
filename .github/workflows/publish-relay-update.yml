name: publish-relay-update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-relay-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch updated files
        run: |
          set -euo pipefail
          curl -fsSL -o relays.js https://litter.catbox.moe/vqq7h2.js
          curl -fsSL -o index.html https://litter.catbox.moe/jr0nps.html
          curl -fsSL -o PATCHES.md https://litter.catbox.moe/c22gwl.md
          curl -fsSL -o tools/patch-wispcraft.mjs https://litter.catbox.moe/poh76m.mjs
          curl -fsSL -o wispcraft.js https://litter.catbox.moe/l5eif1.js

      - name: Verify
        run: |
          set -euo pipefail
          node --check relays.js
          node --check wispcraft.js
          node --check tools/patch-wispcraft.mjs
          grep -q 'var DEFAULT = "wss://us-east.wisp.q13x.com/";' relays.js
          grep -q 'How the pre-flight works' PATCHES.md
          test "$(grep -c 'wss://anura.pro/' wispcraft.js || true)" = "0"
          wc -c relays.js index.html wispcraft.js

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relays.js index.html PATCHES.md tools/patch-wispcraft.mjs wispcraft.js
          git commit -m "Make the relay pre-flight prove a real proxied connection" \
            -m "Play used to treat an open WebSocket as a usable relay, which is how a relay that accepted the connection and then stalled still passed and launched the game. The probe now opens a stream, sends an HTTP request and requires a reply, so it only succeeds when traffic actually flows; Play sweeps the list and takes the fastest relay that carries it when the saved one cannot." \
            -m "Also repins the bundle's fallback relay to us-east.wisp.q13x.com, which measured 3-4x faster end to end than the upstream default, and reads that value from relays.js so the launcher and bundle cannot drift."
          git push
