name: add-tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch files
        run: |
          set -euo pipefail
          curl -fsSL -o test/seed-and-blob.test.mjs https://litter.catbox.moe/begard.mjs
          curl -fsSL -o .github/workflows/verify.yml https://litter.catbox.moe/unmado.yml
          echo "467cd60df3a47be05716f7d8c413b367deadad3ab18f9c0ef8169bed0aeea250  test/seed-and-blob.test.mjs" | sha256sum -c -
          echo "498323443c8bfa3888e1e6f8e10ae50f948e8c2dfd4b5da08a7c1b8dade86f6e  .github/workflows/verify.yml" | sha256sum -c -

      - name: Commit and drop the one-shot workflows
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/fetch-fixtures.yml .github/workflows/add-tests.yml
          git add test/seed-and-blob.test.mjs .github/workflows/verify.yml
          git commit -m "Add the skin seeding and blob layout test to CI" -m "The profile blob, the 16,384-byte skin seeding and the legacy 64x32 conversion were guarded only by a gitignored harness. This runs them from the tracked fixtures on every push, extracting the head script from play.html so the test follows the real client."
          git push
