name: seed-site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch static site bundle
        run: |
          curl -fsSL -o /tmp/site.tgz https://files.catbox.moe/kj4kx1.tgz
          tar xzf /tmp/site.tgz -C .
          test -s play.html
          test -s wispcraft.js
          test -s assets.epk
          test -s sounds.epk
          test -f .nojekyll
          ls -l play.html wispcraft.js assets.epk sounds.epk .nojekyll

      - name: Commit site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Add Eaglercraft 26.3 client bundle (play.html, wispcraft.js, asset EPKs)"
            git push
          fi
