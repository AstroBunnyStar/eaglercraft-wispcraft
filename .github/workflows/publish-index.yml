name: publish-index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch updated launcher
        run: |
          curl -fsSL -o index.html https://files.catbox.moe/5bbz9k.html
          grep -q "pipeline test" index.html
          wc -c index.html

      - name: Commit launcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Update launcher footer build stamp"
            git push
          fi
