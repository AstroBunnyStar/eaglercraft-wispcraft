name: publish-probe-simplification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch updated files
        run: |
          set -euo pipefail
          curl -fsSL -o relays.js https://litter.catbox.moe/vaxait.js
          curl -fsSL -o PATCHES.md https://litter.catbox.moe/n5a5qv.md
          echo "1cdb99c8b0c544239c55fdd1a47d6d830c60aba44eb5c56aa4f4d6f3d9daa6e3  relays.js" | sha256sum -c -
          echo "e07efa37998895183c8d2b0ac4d7bf7c309e689df30996ed674e64b81ad1d912  PATCHES.md" | sha256sum -c -

      - name: Verify
        run: |
          set -euo pipefail
          node --check relays.js
          ! grep -q 'framed' relays.js
          ! grep -q 'greeting ===' relays.js
          grep -q 'no version branch' PATCHES.md

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relays.js PATCHES.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Drop the Wisp version branch from the relay probe" -m "The probe chose its packet layout by greeting length, treating a 5-byte reply as the older v1 framing with no stream id. The protocol spec has no such layout: both versions use [type][streamID u32 LE][payload], and the greeting is a CONTINUE for stream 0, so that branch could only fire on a malformed relay and was never exercised by any relay in the list. Removing it leaves one framing path, and the speculative 700 ms CONNECT is gone too, since the spec requires the greeting before the client sends anything."
            git push
          fi
