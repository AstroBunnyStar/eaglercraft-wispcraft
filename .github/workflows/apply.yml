name: apply

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the new sources
        run: |
          set -euo pipefail
          mkdir -p test
          curl -fsSL --retry 3 -o relays.js https://litter.catbox.moe/a7i5me.js
          curl -fsSL --retry 3 -o PATCHES.md https://litter.catbox.moe/p4f4oi.md
          curl -fsSL --retry 3 -o test/relays-signin.test.mjs https://litter.catbox.moe/nylyqc.mjs
          sha256sum -c <<'EOF'
          4e09968da81452245b331a526b8a7ba33e1efe76df53700cb2e63ea68c817092  relays.js
          51e2b39182618dced38c797327a5c168e9a536fcc79b8ad644ad51e518a90839  PATCHES.md
          7fb24baacb0884cb4e261d07097b5bea18b16d4f087a6b32cbf8bb3f03be41f0  test/relays-signin.test.mjs
          EOF

      - name: Checks
        run: |
          set -euo pipefail
          node --check relays.js
          node tools/check-launcher.mjs
          node --test

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relays.js PATCHES.md test/relays-signin.test.mjs
          git commit -m "Require a real ServerHello in the sign-in pre-flight"
          git push
