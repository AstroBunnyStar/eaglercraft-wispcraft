name: apply fixtures generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install files
        run: |
          set -euo pipefail
          curl -fsS -o tools/make-legacy-fixtures.mjs https://litter.catbox.moe/slgroa.mjs
          curl -fsS -o test/seed-and-blob.test.mjs https://litter.catbox.moe/mn6puf.mjs
          echo "af09bd7ea7f148485240a0f715926a99e839518a9f008e9eab46a5b4182a2863  tools/make-legacy-fixtures.mjs" | sha256sum -c -
          echo "1997eed75d6524f8e0b7821fe3a7047091467c338065ba3540c8e36931fb0ea9  test/seed-and-blob.test.mjs" | sha256sum -c -

      - name: Check and commit
        run: |
          set -euo pipefail
          node --check tools/make-legacy-fixtures.mjs
          node --test test/
          node tools/make-legacy-fixtures.mjs
          git diff --exit-code -- test/fixtures
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/make-legacy-fixtures.mjs test/seed-and-blob.test.mjs
          git commit -m "Generate the legacy skin fixtures from a tracked script"
          git push
