name: apply

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the new sources
        run: |
          set -euo pipefail
          mkdir -p test
          curl -fsSL --retry 3 -o relays.js https://litter.catbox.moe/9snnim.js
          curl -fsSL --retry 3 -o PATCHES.md https://litter.catbox.moe/j04poa.md
          curl -fsSL --retry 3 -o test/relays-signin.test.mjs https://litter.catbox.moe/j8gey1.mjs
          sha256sum -c <<'EOF'
          81aa5c71d91cef0e5b28e65e9872da640edc69cb7e7451ccf37521baa8fe9245  relays.js
          9dbd85a883b3ee13bc8582b5dd34aeca4c2a6bba4fad79349d17a596e46b033e  PATCHES.md
          a05bd92e316aa4a5c50ee6b402e37219679d0da92bf000468d395a0db696bd32  test/relays-signin.test.mjs
          EOF

      - name: Checks
        run: |
          set -euo pipefail
          node --check relays.js
          node tools/check-launcher.mjs
          node --test

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relays.js PATCHES.md test/relays-signin.test.mjs
          git commit -m "Retry a failed traffic test once before calling a relay unusable"
          git push
