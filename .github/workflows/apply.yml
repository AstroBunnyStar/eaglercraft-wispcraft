name: apply hardening

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install files
        run: |
          set -euo pipefail
          curl -fsS -o test/seed-and-blob.test.mjs https://litter.catbox.moe/ksg2vp.mjs
          curl -fsS -o tools/verify-published.mjs https://litter.catbox.moe/b2swju.mjs
          echo "9e7b1379668bcab1a4a96913e71e810c887559063333ec47d2930f1e0fb66067  test/seed-and-blob.test.mjs" | sha256sum -c -
          echo "27b15229b43512f127fdff2077339fa0dfbd123ffa17d5232598f3cd6ac56d1e  tools/verify-published.mjs" | sha256sum -c -

      - name: Check and commit
        run: |
          set -euo pipefail
          node --test
          node tools/verify-published.mjs
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/seed-and-blob.test.mjs tools/verify-published.mjs
          git commit -m "Test the guest-name pin, fetch failure, reload budget and account survival"
          git push
