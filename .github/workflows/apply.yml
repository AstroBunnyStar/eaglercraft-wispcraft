name: apply

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the new sources
        run: |
          set -euo pipefail
          mkdir -p test
          curl -fsSL --retry 3 -o relays.js https://litter.catbox.moe/ai2t1d.js
          curl -fsSL --retry 3 -o PATCHES.md https://litter.catbox.moe/pvsc1m.md
          curl -fsSL --retry 3 -o test/relays-signin.test.mjs https://litter.catbox.moe/oo6x8z.mjs
          sha256sum -c <<'EOF'
          b5a77d686f9139eeead14c004e98dfa5620c0c7362560dffb4913811cdfcf35f  relays.js
          a38cf4c394c110b3421e3c40c901a927b7790d3578e6b493881c7b15783897bf  PATCHES.md
          48a47ba80b7a1f3f2342c8f42b40f35e1e7ab2d3ef15745f8fb6374f8d8b76c7  test/relays-signin.test.mjs
          EOF

      - name: Checks
        run: |
          set -euo pipefail
          node --check relays.js
          node tools/check-launcher.mjs
          node --test

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relays.js PATCHES.md test/relays-signin.test.mjs
          git commit -m "Retry a failed sign-in handshake once before demoting a relay"
          git push
